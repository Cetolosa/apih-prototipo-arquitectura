name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y postgresql libfaketime   # backend de pruebas: Postgres real con las migraciones del repositorio
      - run: npm ci
      - run: node tools/guardia-reglas.js && node tools/lint-terminos.js && node tools/verificar-modulos.js
      - name: Paridad con el Corporativo (misma rama si existe; si no, main)
        run: |
          R="${{ github.head_ref || github.ref_name }}"
          git clone -q --depth 1 --branch "$R" https://github.com/Cetolosa/apih-corporativo-arquitectura ../otro 2>/dev/null || git clone -q --depth 1 https://github.com/Cetolosa/apih-corporativo-arquitectura ../otro
          node tools/paridad.mjs ../otro
      - run: node tools/empaquetar-migraciones.js && git diff --exit-code supabase/aplicar_en_supabase.sql   # el paquete para Supabase debe estar al día
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-e2e
          path: test-results/e2e-junit.xml

  sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql libfaketime
      - run: sudo -E bash tools/test-sql.sh

  pruebas-ti:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: sudo apt-get update && sudo apt-get install -y postgresql libfaketime
      - run: sudo -E env "PATH=$PATH" node pruebas-ti/correr.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pruebas-ti-informe
          path: pruebas-ti/informe.md

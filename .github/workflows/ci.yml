name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y postgresql   # backend de pruebas: Postgres real con las migraciones del repositorio
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql
      - run: sudo -E bash tools/test-sql.sh

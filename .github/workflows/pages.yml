name: Publicar en GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Armar el sitio (solo lo que usa la SPA; sin pruebas, SQL ni herramientas)
        run: |
          mkdir _site
          cp index.html apih-config.js _site/
          cp -r js css _site/
          touch _site/.nojekyll
      - name: Inyectar la clave publishable (variable de Actions, no está en el repositorio)
        env:
          CLAVE: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$CLAVE" || { echo "::error::Falta la variable de Actions SUPABASE_PUBLISHABLE_KEY"; exit 1; }
          grep -q "anonKey: ''" _site/apih-config.js || { echo "::error::apih-config.js no tiene el campo anonKey vacío"; exit 1; }
          sed -i "s|anonKey: ''|anonKey: '$CLAVE'|" _site/apih-config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
